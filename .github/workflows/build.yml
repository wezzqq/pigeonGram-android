name: Build pigeonGram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;21.4.7075529"

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          mkdir -p TMessagesProj/config
          mv release.keystore TMessagesProj/config/

      - name: Build APK
        run: ./gradlew TMessagesProj_App:assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: TMessagesProj_App/build/outputs/apk/
